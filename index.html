<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/general.css" />
  </head>
  <body>
    <nav>
      <h1>EMILIANO MOLINA</h1>
      <button id="display-options">
        <img
          src="img/icon/drag_handle_24dp_5F6368_FILL0_wght400_GRAD0_opsz24.svg"
          alt="display_menu"
        />
      </button>
      <ul id="menu-list" style="display: none">
        <li>
          <a href="/pages/about.html">Sobre mí</a>
        </li>
        <li>
          <a href="/pages/contact.html">Contacto</a>
        </li>
        <li>
          <a href="/pages/projects.html">Proyectos</a>
        </li>
        <li>
          <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank"
            >Random</a
          >
        </li>
      </ul>
    </nav>
    <div id="content"></div>
    <script>
      const menuButton = document.getElementById("display-options");
      const optionList = document.getElementById("menu-list");
      const content = document.getElementById("content");

      menuButton.addEventListener("click", () => {
        if (optionList.style.display == "none") {
          optionList.style.display = "block";
        } else {
          optionList.style.display = "none";
        }
      });

      const titlesAndDescriptions = [
        {
          title: "Mi trabajo",
          description: "Esta es una descripción de mi trabajo",
          button: "Este es el texto del botón",
          link: "pages/projects",
        },
        {
          title: "Quien soy",
          description: "Esta es una descripción de quién soy",
          button: "Este es el texto del botón",
          link: "pages/about",
        },
        {
          title: "Contacto",
          description: "Esta es una descripción de mi trabajo",
          button: "Este es el texto del botón",
          link: "pages/contact",
        },
      ];

      for (let i = 0; i <= titlesAndDescriptions.length; i++) {
        const card = document.createElement("div");
        const title = document.createElement("h2");
        const description = document.createElement("span");
        const cardButton = document.createElement("button");
        const anchor = document.createElement("a");
        title.style.fontSize = "2rem";
        title.textContent = titlesAndDescriptions[i].title;
        description.textContent = titlesAndDescriptions[i].description;
        anchor.textContent = titlesAndDescriptions[i].button;
        anchor.href = titlesAndDescriptions[i].link;
        card.appendChild(title);
        card.appendChild(description);
        cardButton.appendChild(anchor);
        card.appendChild(cardButton);
        content.appendChild(card);
      }
    </script>
  </body>
</html>
